<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phục Chế Ảnh AI</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load thư viện Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="container">
        <!-- Cột 1: Bảng điều khiển & Chọn ảnh -->
        <div class="panel control-panel">
            <h3 class="panel-title">BẢNG ĐIỀU KHIỂN</h3>
            
            <!-- Đăng nhập Google chuẩn -->
            <div class="auth-section">
                <label>Xác thực tài khoản Google:</label>
                <div id="buttonDiv"></div>
                <div id="auth-status" class="status-box disconnected" style="margin-top: 10px;">
                    🔴 Chưa kết nối Google
                </div>
            </div>

            <!-- Nút chọn ảnh chuyển vào cột điều khiển -->
            <div class="upload-section">
                <label>Chọn ảnh gốc cần phục chế:</label>
                <input type="file" id="image-upload" accept="image/*">
            </div>

            <!-- Tùy chỉnh Prompt -->
            <div class="prompt-section">
                <label>Yêu cầu tùy chỉnh (Prompt):</label>
                <textarea id="prompt-input" placeholder="Phục chế chất lượng cao, nét căng, giữ màu xám nguyên bản..."></textarea>
            </div>

            <!-- Các mẫu có sẵn -->
            <div class="preset-section">
                <label>Hoặc chọn một mẫu có sẵn:</label>
                <div class="radio-group">
                    <label><input type="radio" name="preset" value="Phục chế chất lượng cao" checked> Phục chế chất lượng cao</label>
                    <label><input type="radio" name="preset" value="Phục chế & Tô màu"> Phục chế & Tô màu</label>
                    <label><input type="radio" name="preset" value="Tái tạo ảnh hỏng nặng"> Tái tạo ảnh hỏng nặng</label>
                    <label><input type="radio" name="preset" value="Khử ố vàng & Phai màu"> Khử ố vàng & Phai màu</label>
                    <label><input type="radio" name="preset" value="Phục chế chân dung nâng cao"> Phục chế chân dung nâng cao</label>
                    <label><input type="radio" name="preset" value="Ghép Trang Phục"> Ghép Trang Phục</label>
                </div>
            </div>

            <!-- Nút Bắt đầu xử lý -->
            <div class="action-section">
                <button id="btn-process" disabled>Vui lòng đăng nhập để bắt đầu</button>
            </div>
        </div>

        <!-- Cột 2: Ảnh gốc to rõ nằm chính giữa -->
        <div class="panel image-panel">
            <h3 class="panel-title red-title">ẢNH GỐC</h3>
            <div class="image-container">
                <span id="placeholder-text" style="color: #666; font-size: 0.9rem;">Chưa có ảnh tải lên</span>
                <img id="original-image" src="" alt="Ảnh gốc" style="display: none;">
            </div>
        </div>

        <!-- Cột 3: Ảnh đã phục chế -->
        <div class="panel image-panel">
            <h3 class="panel-title yellow-title">ẢNH ĐÃ PHỤC CHẾ</h3>
            <div class="image-container">
                <div id="loading-spinner" style="display: none;">AI đang tiến hành phục chế...</div>
                <div id="result-content"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
